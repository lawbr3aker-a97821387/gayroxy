name: Build & Deploy Proxy

concurrency:
  # v2 group: the original `gayroxy-deploy` is wedged by an un-cancellable
  # in_progress run (33422909163, old 3-job workflow) that holds the group and
  # blocks every new dispatch. A fresh group lets this run start immediately;
  # serve.sh's handover lock safely handles the momentary tunnel overlap.
  group: gayroxy-deploy-v2
  cancel-in-progress: true

on:
  push:
    branches: [master]
  # Daily re-render + re-deploy so the service keeps running even if no code
  # changed (geo refresh, tunnel upkeep).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  EXTERNAL_SUB_URLS: ${{ secrets.EXTERNAL_SUB_URLS }}
  # Set automatically by deploy-cf.sh after the first deploy (repo variable).
  WORKER_URL: ${{ vars.WORKER_URL }}
  # Static custom domain for the pages (e.g. proxy.example.com).
  WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
  # NAMED TUNNEL (automatic): just set the CF_TOKEN secret. serve.sh derives
  # everything at boot via the CF API — first account + first active zone →
  # fixed hostname gaaayroxy.<zone>, create-or-reuse tunnel, point DNS at it
  # (CNAME → <tunnel-id>.cfargotunnel.com, proxied). CF_TOKEN needs
  # Account·Cloudflare Tunnel:Edit + Zone·Zone:Read + Zone·DNS:Edit. Without
  # CF_TOKEN it falls back to the random quick tunnel. No domain secrets.

jobs:
  # ── 1. render ──────────────────────────────────────────────────────────────
  # Generate sub/panel/subscription from templates + credentials. Short-lived.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/lib/*.sh scripts/publish/*.sh scripts/agent/*.sh

      - name: Compute cache week (geo refreshes weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            geo-${{ runner.os }}-

      - name: ⚡ Render assets
        id: render
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          # CF_TOKEN lets render resolve the static named hostname
          # (gaaayroxy.<zone>) so the FIRST deploy already carries the real
          # stable sub URL — no placeholder flash.
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TUNNEL_ZONE: ${{ vars.TUNNEL_ZONE }}
          SEED: ${{ secrets.CF_TOKEN || github.repository }}
        run: |
          mkdir -p logs
          set -o pipefail
          echo "::group::Render Output"
          ./scripts/build-assets.sh 2>&1 | tee logs/render.log
          echo "::endgroup::"

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-assets
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

  # ── 2. deploy-assets ───────────────────────────────────────────────────────
  # Push the rendered assets + geo DBs to Cloudflare Worker + KV. Isolated node:
  # a deploy failure must not affect asset generation or the tunnel.
  deploy-assets:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/publish/deploy-cf.sh

      - name: Compute cache week (geo refreshes weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            geo-${{ runner.os }}-

      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets

      - name: ☁️ Deploy assets to Cloudflare Worker + KV
        id: deploy
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
        run: |
          set -o pipefail
          echo "::group::Cloudflare Deploy"
          mkdir -p sub
          if [[ -d render-assets/sub ]]; then
            cp -r render-assets/sub/. sub/
          fi
          # If render failed and produced no sub artifact, don't deploy stale/
          # missing assets here — serve (if: always()) still boots and its
          # LIVE_DEPLOY publishes the correct live sub.
          if [[ -f sub/subscription.b64 ]]; then
            ./scripts/publish/deploy-cf.sh 2>&1
          else
            echo "render artifact missing sub/subscription.b64 — skipping pre-seed deploy (serve LIVE_DEPLOY will publish)."
          fi
          echo "::endgroup::"

  # ── 3. boot-verify ─────────────────────────────────────────────────────────
  # Confirm the Worker serves the deployed assets end-to-end BEFORE serve runs.
  # Non-zero exit → serve (if: always()) still boots; this is a fast health gate.
  boot-verify:
    needs: deploy-assets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/lib/*.sh

      - name: 🔍 Verify Worker endpoint serves
        id: verify
        env:
          WORKER_URL: ${{ env.WORKER_URL }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
        run: |
          set -o pipefail
          echo "::group::Boot Verify"
          ./scripts/publish/boot-verify.sh 2>&1
          echo "::endgroup::"

  # ── 4. publish-live ────────────────────────────────────────────────────────
  # Final live publish: re-run the (idempotent) deploy so KV carries the newest
  # sub and the Worker keeps the derived API_TOKEN binding (security fix —
  # shared token between deploy-cf.sh and the health agent). Short-lived.
  publish-live:
    needs: [render, boot-verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/publish/deploy-cf.sh scripts/publish/publish-live.sh scripts/lib/*.sh

      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets

      - name: 🚀 Publish live assets
        id: publish
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
        run: |
          set -o pipefail
          echo "::group::Publish Live"
          mkdir -p sub
          if [[ -d render-assets/sub ]]; then
            cp -r render-assets/sub/. sub/
          fi
          if [[ ! -f sub/subscription.b64 ]]; then
            echo "render artifact missing sub/subscription.b64 — nothing to publish; will rely on serve LIVE_DEPLOY."
            echo "::endgroup::"
            exit 0
          fi
          export SUB_DIR="$PWD/sub"
          ./scripts/publish/publish-live.sh 2>&1
          echo "::endgroup::"

  # ── 5. serve ───────────────────────────────────────────────────────────────
  # LONG-LIVED supervisor (240-min): boots xray+nginx+cloudflared named tunnel,
  # then owns the health agent (background child), LIVE_DEPLOY of the live URL,
  # the auto-re-trigger, and the tunnel watchdog for the whole job lifetime.
  # This is the ONLY job allowed to hold long-lived processes (GitHub gives each
  # job a fresh runner; a process cannot outlive its job).
  serve:
    needs: [render, deploy-assets, boot-verify, publish-live]
    # A render/deploy failure must NOT kill the tunnel: serve always boots its
    # own tunnel and its LIVE_DEPLOY still publishes a working sub.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/lib/*.sh scripts/publish/*.sh scripts/agent/*.sh .github/retrigger.sh

      - name: Compute cache week (geo refreshes weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            geo-${{ runner.os }}-

      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets

      - name: Get latest xray version (cache key)
        id: xrayver
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -oP '"tag_name"\s*:\s*"\K[^"]+' | head -1)
          echo "tag=${tag:-unknown}" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache xray binary (per release)
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-${{ runner.os }}-${{ steps.xrayver.outputs.tag }}
          restore-keys: |
            xray-${{ runner.os }}-

      - name: ▶️ Run serve (long-lived tunnel + health agent)
        id: serve
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          AUTO_RETRIGGER: "1"
          LIVE_DEPLOY: "1"
          HEALTH_AGENT: "1"
          HEALTH_INTERVAL: "600"
          ROTATE2MIN_INTERVAL: "120"
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TUNNEL_ZONE: ${{ vars.TUNNEL_ZONE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SEED: ${{ secrets.CF_TOKEN || github.repository }}
        run: |
          mkdir -p logs
          set -o pipefail
          # Use the render job's sub/ (already carries the named-domain URL).
          if [[ -d render-assets/sub ]]; then
            cp -r render-assets/sub/. sub/ 2>/dev/null || true
          fi
          echo "::group::Serve Output"
          ./scripts/serve.sh 2>&1 | tee logs/run.log
          echo "::endgroup::"

      # No run-end ☁️ Publish step: LIVE_DEPLOY inside serve.sh publishes the
      # live tunnel URL to Cloudflare within seconds of boot.

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-logs
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

      - name: 🔄 Re-trigger (keep alive — runs on ANY outcome, incl. failure/timeout)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: .github/retrigger.sh
