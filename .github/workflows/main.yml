name: Build & Deploy Proxy

# ─── Single-run policy ────────────────────────────────────────────────────
# Only ONE run may be in progress at a time. When a new run starts (push,
# schedule, or dispatch), every older run is cancelled immediately — no
# overlapping proxy jobs, no retrigger dispatch storms.
concurrency:
  group: gayroxy-deploy
  cancel-in-progress: true
run-name: Build & Deploy ${{ github.run_id }}
on:
  push:
    branches: [master]
  schedule:
    # Safety net: guarantees a fresh run even if the self-retrigger chain breaks.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

# ═══════════════════════════════════════════════════════════════════════════
#  STEALTH CONFIGURATION
#  • Runs 24/7 via auto-re-trigger: AUTO_RETRIGGER inside proxy.sh fires the
#    next run ~8 min before the 240-min cap, and the final step re-dispatches
#    on ANY outcome (if: always()) so a failed/timed-out run is followed up.
#  • Static assets (sub/panel/geo/index) are served from Cloudflare Workers+KV
#    — deployed by deploy-cf.sh, always-on, fast, independent of the tunnel.
#  • Tunnel: NAMED TUNNEL when CF_TOKEN is set (stable hostname — configs
#    never change across runs; proxy.sh does EVERYTHING at boot via the CF
#    API: picks the first account + first active zone, derives the fixed
#    hostname gaaayroxy.<zone>, creates-or-reuses the tunnel, points DNS at
#    it — no domain/tunnel-token secrets needed); otherwise the zero-config
#    QUICK TUNNEL (random trycloudflare.com URL, rotated every run, published
#    to the Worker within seconds of the tunnel booting).
#
#  TWO JOBS (proxy independent of render — the tunnel must never wait on
#  asset publishing):
#  • render — RENDER_ONLY=1: generates sub/panel/geo fast (~2 min), deploys
#    to Cloudflare Worker+KV. Runs on every push/retrigger.
#  • proxy  — runs the real long-lived tunnel (up to 240 min), publishes the
#    live tunnel URL to the Worker at boot, re-triggers at the end.
#
#  SINGLE-RUN POLICY (concurrency group above):
#  • Exactly ONE run in progress at a time. A new run cancels every older
#    run the instant it starts — the old tunnel dies, the new run boots a
#    fresh one. No overlapping proxy jobs, no dispatch storms.
#  • retrigger.sh (always()) is the chain keeper: it only dispatches a
#    successor when no other run is queued/in-progress.
# ═══════════════════════════════════════════════════════════════════════════

permissions:
  actions: write
  contents: write

env:
  EXTERNAL_SUB_URLS: ${{ secrets.EXTERNAL_SUB_URLS }}
  # Set automatically by deploy-cf.sh after the first deploy (repo variable).
  WORKER_URL: ${{ vars.WORKER_URL }}
  # Static custom domain for the pages (e.g. proxy.example.com).
  # Set once as a repo variable (Settings → Secrets and variables → Actions →
  # Variables → New variable: WORKER_DOMAIN). deploy-cf.sh binds it to the
  # Worker as a Workers Custom Domain (auto-DNS + managed TLS, free plan).
  WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
  # NAMED TUNNEL (automatic): just set the CF_TOKEN secret. proxy.sh derives
  # everything at boot via the CF API — first account + first active zone →
  # fixed hostname gaaayroxy.<zone>, create-or-reuse tunnel, point DNS at it
  # (CNAME → <tunnel-id>.cfargotunnel.com, proxied). CF_TOKEN needs
  # Account·Cloudflare Tunnel:Edit + Zone·Zone:Read + Zone·DNS:Edit. Without
  # CF_TOKEN it falls back to the random quick tunnel. No domain secrets.

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x proxy.sh deploy-cf.sh

      - name: Compute cache week (geo refreshes weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            geo-${{ runner.os }}-

      - name: ⚡ Render assets (RENDER_ONLY)
        id: render
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          RENDER_ONLY: "1"
          # CF_TOKEN lets the RENDER_ONLY render resolve the static named
          # hostname (gaaayroxy.<zone>) so the FIRST deploy already carries
          # the real stable sub URL — no placeholder flash.
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          # TUNNEL_ZONE pins the named tunnel to a specific zone (set by deploy.sh).
          # Falls back to first active zone alphabetically if not set.
          TUNNEL_ZONE: ${{ vars.TUNNEL_ZONE }}
          SEED: ${{ secrets.CF_TOKEN || github.repository }}
        run: |
          mkdir -p logs
          set -o pipefail
          echo "::group::Render Output"
          ./proxy.sh 2>&1 | tee logs/render.log
          echo "::endgroup::"

      - name: ☁️ Deploy assets to Cloudflare Worker + KV
        id: deploy
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
        run: |
          mkdir -p logs
          set -o pipefail
          echo "::group::Cloudflare Deploy"
          ./deploy-cf.sh 2>&1 | tee -a logs/render.log
          echo "::endgroup::"

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-assets
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

  proxy:
    # needs: render — guarantees the render job's deploy (stale/placeholder sub)
    # lands FIRST, then LIVE_DEPLOY inside proxy.sh overwrites KV with the live
    # tunnel URL. Without this, the two independent deploys could race and leave
    # a dead URL in KV for the whole cycle.
    # if: always() — a render failure must NOT kill the tunnel: the proxy job
    # still boots its own tunnel and LIVE_DEPLOY still publishes a working sub.
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x proxy.sh deploy-cf.sh .github/retrigger.sh

      - name: Compute cache week (geo refreshes weekly)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            geo-${{ runner.os }}-

      - name: Get latest xray version (cache key)
        id: xrayver
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -oP '"tag_name"\s*:\s*"\K[^"]+' | head -1)
          echo "tag=${tag:-unknown}" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache xray binary (per release)
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-${{ runner.os }}-${{ steps.xrayver.outputs.tag }}
          restore-keys: |
            xray-${{ runner.os }}-

      - name: ▶️ Run proxy (long-lived tunnel)
        id: proxy
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          AUTO_RETRIGGER: "1"
          LIVE_DEPLOY: "1"
          # LIVE_DEPLOY pushes the live-tunnel sub to Cloudflare KV at boot,
          # so the proxy job needs the CF token too (not just the render job).
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          # TUNNEL_ZONE pins the named tunnel to a specific zone (set by deploy.sh).
          # Falls back to first active zone alphabetically if not set.
          TUNNEL_ZONE: ${{ vars.TUNNEL_ZONE }}
          # PAT is required (outlives the built-in token, higher rate limits).
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SEED: ${{ secrets.CF_TOKEN || github.repository }}
        run: |
          mkdir -p logs
          set -o pipefail
          echo "::group::Proxy Output"
          ./proxy.sh 2>&1 | tee logs/run.log
          echo "::endgroup::"

      # No run-end ☁️ Publish step: LIVE_DEPLOY=1 inside proxy.sh publishes the
      # live tunnel URL to Cloudflare within seconds of boot (the sub is
      # rendered with the real URL at that moment). A run-end re-deploy would
      # publish a URL whose tunnel is already dying — clients would import a
      # dead sub for the whole next cycle.

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-logs
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

      - name: 🔄 Re-trigger (keep alive — runs on ANY outcome, incl. failure/timeout)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: .github/retrigger.sh
