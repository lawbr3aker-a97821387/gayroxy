name: "Keepalive Watchdog"

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: gayroxy-keepalive
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Self-heal the main workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MIN_AGE_SEC: 200
        run: |
            #!/usr/bin/env bash
            set -uo pipefail

            mapfile -t run_ids < <(gh run list -L 100 --workflow "Build Deploy Proxy" \
            --json status,databaseId \
            --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId')

            pids=()
            for id in "${run_ids[@]}"; do
            {
                started_at=$(gh run view "$id" --json startedAt --jq .startedAt)
                if [[ -z "$started_at" || "$started_at" == "null" ]]; then
                exit 2
                fi

                elapsed=$(( $(date -u +%s) - $(date -d "$started_at" +%s) ))
                (( elapsed < MIN_AGE_SEC )) && sleep $(( MIN_AGE_SEC - elapsed ))

                tmp_dir=$(mktemp -d)
                gh run download "$id" --dir "$tmp_dir" &>/dev/null

                if find "$tmp_dir" -name flag-deployed -print -quit | grep -q .; then
                rm -rf "$tmp_dir"
                exit 0
                fi

                gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" &>/dev/null
                rm -rf "$tmp_dir"
                exit 1
            } &
            pids+=("$!")
            done

            ok=0 cancelled=0 skipped=0
            for pid in "${pids[@]}"; do
            wait "$pid"
            case $? in
                0) ((ok++)) ;;
                1) ((cancelled++)) ;;
                *) ((skipped++)) ;;
            esac
            done

            if (( ok == 0 )); then
            echo "No healthy runs left — triggering workflow."
            gh workflow run "Build Deploy Proxy"
            fi
