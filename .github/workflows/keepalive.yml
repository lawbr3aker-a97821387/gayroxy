name: "Keepalive Watchdog"

on:
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Deploy Proxy"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: gayroxy-keepalive
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Self-heal the main workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MIN_AGE_SEC: 200
        run: |
          set -uo pipefail

          mapfile -t run_ids < <(gh run list -L 100 --workflow "Build Deploy Proxy" \
            --json status,databaseId \
            --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId')

          echo "Found ${#run_ids[@]} in-progress/queued run(s): ${run_ids[*]:-none}"

          pids=()
          for id in "${run_ids[@]}"; do
          {
            started_at=$(gh run view "$id" --json startedAt --jq .startedAt)
            if [[ -z "$started_at" || "$started_at" == "null" ]]; then
              echo "[run $id] no startedAt yet, skipping this cycle"
              exit 2
            fi

            elapsed=$(( $(date -u +%s) - $(date -d "$started_at" +%s) ))
            echo "[run $id] elapsed=${elapsed}s"
            if (( elapsed < MIN_AGE_SEC )); then
              echo "[run $id] too young, sleeping $(( MIN_AGE_SEC - elapsed ))s before checking"
              sleep $(( MIN_AGE_SEC - elapsed ))
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/artifacts?per_page=100" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx "flag-deployed"; then
              echo "[run $id] healthy — flag-deployed found"
              exit 0
            fi

            echo "[run $id] UNHEALTHY — no flag-deployed artifact, force-cancelling"
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel"
            exit 1
          } &
          pids+=("$!")
          done

          ok=0 cancelled=0 skipped=0
          for pid in "${pids[@]}"; do
            wait "$pid"
            case $? in
              0) ok=$((ok+1)) ;;
              1) cancelled=$((cancelled+1)) ;;
              *) skipped=$((skipped+1)) ;;
            esac
          done

          echo "Summary: ok=$ok cancelled=$cancelled skipped=$skipped"

          if (( ok == 0 )); then
            echo "No healthy runs left — triggering workflow."
            gh workflow run "Build Deploy Proxy" --ref master
          fi
