name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck all scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          while IFS= read -r -d '' f; do
            shellcheck -x --severity=warning "$f" || exit 1
          done < <(find scripts -name '*.sh' -type f -print0)

  shfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shfmt check (advisory)
        run: |
          curl -sSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shfmt -d -i 2 -ci -bn scripts/ tools/ 2>/dev/null | grep -q . \
            && echo "shfmt: formatting differences (non-blocking)" \
            || echo "shfmt clean"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          export PATH="$HOME/go/bin:$PATH"
          actionlint

  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax check all scripts
        run: |
          while IFS= read -r -d '' f; do
            bash -n "$f" || exit 1
          done < <(find scripts -name '*.sh' -type f -print0)

  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Node syntax check worker
        run: |
          node --check worker/index.js

  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Subscription and rotation smoke tests
        run: |
          chmod +x tests/test_subscription_smoke.sh
          tests/test_subscription_smoke.sh
