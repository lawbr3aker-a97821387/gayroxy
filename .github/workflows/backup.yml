name: "Build & Deploy Proxy (Backup)"

concurrency:
  group: gayroxy-deploy-${{ github.run_id }}
  cancel-in-progress: true

on:
  push:

permissions:
  actions: write
  contents: write

env:
  EXTERNAL_SUB_URLS: ${{ secrets.EXTERNAL_SUB_URLS }}
  WORKER_URL: ${{ vars.WORKER_URL }}
  WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
  TUNNEL_ZONE: ${{ vars.TUNNEL_ZONE || 'ai-masters.ir' }}
  RUN_TIMEOUT_MIN: 285
  RETRIGGER_LEAD_MIN: 5

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*/*.sh
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: geo-${{ runner.os }}-
      - name: ⚡ Render assets
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TUNNEL_ZONE: ${{ env.TUNNEL_ZONE }}
          SEED: "${{ secrets.CF_TOKEN || github.repository }}"
        run: |
          mkdir -p logs
          set -o pipefail
          echo "::group::Render Output"
          ./scripts/render/build-assets.sh 2>&1 | tee logs/render.log
          echo "::endgroup::"
      - name: ☁️ Deploy assets to Cloudflare Worker (once)
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          WORKER_DOMAIN: ${{ env.WORKER_DOMAIN }}
          WORKER_URL: ${{ env.WORKER_URL }}
          TUNNEL_ZONE: ${{ env.TUNNEL_ZONE }}
        run: |
          set -o pipefail
          if [[ -f sub/subscription.b64 ]]; then
            export SUB_DIR="$PWD/sub"
            echo "::group::Cloudflare Deploy"
            ./scripts/publish/deploy-cf.sh 2>&1
            echo "::endgroup::"
          fi
      - name: 🔍 Verify Worker endpoint serves
        run: |
          set -o pipefail
          WORKER_URL="${{ env.WORKER_URL }}"
          if [[ -z "$WORKER_URL" ]]; then
            WORKER_URL="https://${{ env.TUNNEL_ZONE }}/sub"
          fi
          echo "Verifying $WORKER_URL..."
          curl -sSf --max-time 30 -k "$WORKER_URL" >/dev/null
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-assets
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

  serve:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*/*.sh
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: geo-${{ runner.os }}-
      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets
      - name: Get latest xray version (cache key)
        id: xrayver
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -oP '"tag_name"\s*:\s*"\K[^"]+' | head -1)
          echo "tag=${tag:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache xray binary (per release)
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-${{ runner.os }}-${{ steps.xrayver.outputs.tag }}
          restore-keys: xray-${{ runner.os }}-
      - name: ▶️ Run serve (long-lived tunnel + health agent)
        id: serve
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          ROTATEWARP2MIN_INTERVAL: "120"
          ROTATEWARP4MIN_INTERVAL: "240"
          ROTATEWARP6MIN_INTERVAL: "360"
          PARALLEL_PROBES: "10"
          HEALTH_TIMEOUT: "10"
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TUNNEL_ZONE: ${{ env.TUNNEL_ZONE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SEED: "${{ secrets.CF_TOKEN || github.repository }}"
          FLAG_DEPLOYED_FILE: "/tmp/flag-deployed"
        run: |
          mkdir -p logs
          set -o pipefail
          if [[ -d render-assets/sub ]]; then cp -r render-assets/sub/. sub/ 2>/dev/null || true; fi

          echo "::group::Serve Output"
          setsid ./scripts/serve.sh 2>&1 | tee logs/run.log &
          SERVE_PID=$!
          echo "::endgroup::"

          echo "Wait till the  apear"
          while [ ! -f "$FLAG_DEPLOYED_FILE" ]; do
              sleep 10
          done

          echo "Tunnel deployed"

          set +e
          {
            gh run list -L 100 --workflow "Build & Deploy Proxy" \
              --json status,databaseId \
              -q '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId'
            gh run list -L 100 --workflow "Proxy Handover" \
              --json status,databaseId \
              -q '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId'
          } | sort -u \
            | grep -v "${{ github.run_id }}" \
            | xargs -r -I{} gh api -X POST /repos/${{ github.repository }}/actions/runs/{}/force-cancel
          set -e
          echo "Cleanup completed."

          wait $SERVE_PID
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handover-logs
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

  retrigger:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Dispatch Handover
        run: |
          RETRIGGER_DELAY_MIN=$(( RUN_TIMEOUT_MIN - RETRIGGER_LEAD_MIN ))
          echo "Will dispatch 'Build & Deploy Proxy (Backup)' workflow in $RETRIGGER_DELAY_MIN minutes..."
          sleep "${RETRIGGER_DELAY_MIN}m"   # 'm' suffix works with GNU sleep
          gh workflow run 'Build & Deploy Proxy (Backup)' --ref master
          echo "Dispatched."
