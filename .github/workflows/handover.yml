name: "Deploy Proxy #Handover"

concurrency:
  group: gayroxy-deploy-handover-${{ github.sha }}
  cancel-in-progress: true

# on:
#   push:
#     branches: [master]

permissions:
  actions: write
  contents: write

env:
  EXTERNAL_SUB_URLS: ${{ secrets.EXTERNAL_SUB_URLS }}
  WORKER_URL: ${{ vars.WORKER_URL }}
  WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
  TUNNEL_ZONE: ${{ vars.TUNNEL_ZONE || 'ai-masters.ir' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*/*.sh
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: geo-${{ runner.os }}-
      - name: ⚡ Render assets
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TUNNEL_ZONE: ${{ env.TUNNEL_ZONE }}
          SEED: "${{ secrets.CF_TOKEN || github.repository }}"
        run: |
          mkdir -p logs
          set -o pipefail
          echo "::group::Render Output"
          ./scripts/render/build-assets.sh 2>&1 | tee logs/render.log
          echo "::endgroup::"
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-assets
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3
  deploy-assets:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/publish/deploy-cf.sh
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: geo-${{ runner.os }}-
      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets
      - name: ☁️ Deploy assets to Cloudflare Worker + KV
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          WORKER_DOMAIN: ${{ env.WORKER_DOMAIN }}
        run: |
          set -o pipefail
          echo "::group::Cloudflare Deploy"
          mkdir -p sub
          if [[ -d render-assets/sub ]]; then cp -r render-assets/sub/. sub/; fi
          if [[ -f sub/subscription.b64 ]]; then
            export SUB_DIR="$PWD/sub"
            ./scripts/publish/deploy-cf.sh 2>&1
          fi
          echo "::group::"

  boot-verify:
    needs: deploy-assets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*/*.sh
      - name: 🔍 Verify Worker endpoint serves
        run: |
          set -o pipefail
          WORKER_URL="${{ env.WORKER_URL }}"
          if [[ -z "$WORKER_URL" ]]; then
            WORKER_URL="https://${{ env.TUNNEL_ZONE }}/sub"
          fi
          echo "Verifying $WORKER_URL..."
          curl -sSf --max-time 30 -k "$WORKER_URL" >/dev/null

  publish-live:
    needs: boot-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/publish/publish-live.sh
      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets
      - name: 🌐 Publish live sub URL to Cloudflare Worker
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          WORKER_URL: ${{ env.WORKER_URL }}
          TUNNEL_ZONE: ${{ env.TUNNEL_ZONE }}
        run: |
          mkdir -p sub logs
          if [[ -d render-assets/sub ]]; then cp -r render-assets/sub/. sub/; fi
          export SUB_DIR="$PWD/sub"
          echo "::group::Publish Live"
          ./scripts/publish/publish-live.sh 2>&1
          echo "::group::"
  serve:
    needs: [render, deploy-assets, boot-verify, publish-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*/*.sh .github/retrigger.sh
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache geo databases (weekly)
        uses: actions/cache@v4
        with:
          path: geo
          key: geo-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: geo-${{ runner.os }}-
      - name: ⬇️ Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: proxy-assets
          path: render-assets
      - name: Get latest xray version (cache key)
        id: xrayver
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep -oP '"tag_name"\s*:\s*"\K[^"]+' | head -1)
          echo "tag=${tag:-unknown}" >> "$GITHUB_OUTPUT"
      - name: ♻️ Cache xray binary (per release)
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-${{ runner.os }}-${{ steps.xrayver.outputs.tag }}
          restore-keys: xray-${{ runner.os }}-
      - name: ▶️ Run serve (long-lived tunnel + health agent)
        id: serve
        env:
          EXTERNAL_SUB_URLS: ${{ env.EXTERNAL_SUB_URLS }}
          WORKER_URL: ${{ env.WORKER_URL }}
          AUTO_RETRIGGER: "0"
          # RUN_TIMEOUT_MIN: "6"
          # RETRIGGER_LEAD_MIN: "1"
          LIVE_DEPLOY: "1"
          HEALTH_AGENT: "1"
          HEALTH_INTERVAL: "600"
          ROTATE1MIN_INTERVAL: "60"
          ROTATE2MIN_INTERVAL: "120"
          ROTATE5MIN_INTERVAL: "300"
          ROTATEWARP2MIN_INTERVAL: "120"
          ROTATEWARP4MIN_INTERVAL: "240"
          ROTATEWARP6MIN_INTERVAL: "360"
          PARALLEL_PROBES: "10"
          HEALTH_TIMEOUT: "10"
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TUNNEL_ZONE: ${{ env.TUNNEL_ZONE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SEED: "${{ secrets.CF_TOKEN || github.repository }}"
        run: |
          mkdir -p logs
          set -o pipefail
          if [[ -d render-assets/sub ]]; then cp -r render-assets/sub/. sub/ 2>/dev/null || true; fi
          echo "::group::Serve Output"
          setsid ./scripts/serve.sh 2>&1 | tee logs/run.log
          echo "::group::"
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-logs
          path: |
            logs/
            sub/*.html
            sub/subscription.b64
          if-no-files-found: ignore
          retention-days: 3

  retrigger:
    needs: [render, deploy-assets, boot-verify, publish-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      RUN_TIMEOUT_MIN: 280
    steps:
      - name: Dispatch Main
        run: |
          echo "Will dispatch 'main.yml' workflow in ${{ env.RUN_TIMEOUT_MIN }} minutes..."
          sleep "${{ env.RUN_TIMEOUT_MIN }}m"
          gh workflow run main.yml --ref master
          echo "Dispatched."
