        }

        # ── Geo databases (client-side routing rules) ────────────────
        location /geo/ {
            alias /home/runner/work/gayroxy/gayroxy/geo/;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=3600";
        }

        location /panel {
            root /home/runner/work/gayroxy/gayroxy/sub;
            try_files $uri /panel.html;
        }

        location / {
            root /home/runner/work/gayroxy/gayroxy/sub;
            try_files $uri /index.html;
        }
    }
