worker_processes 1;
pid /home/runner/work/gayroxy/gayroxy/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/null;
    error_log /home/runner/work/gayroxy/gayroxy/logs/nginx-error.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 9000;
        server_name _;

        # ── Static endpoints ──────────────────────────────────
        location /sub {
            alias /home/runner/work/gayroxy/gayroxy/sub/subscription.b64;
            default_type text/plain;
        }

        # ── WebSocket locations ────────────────────────────────
        location /1ede9e493bbe3a28 {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
        }

        location /24510ae21f22d661 {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
        }

        location /1fbe2694845117ab {
            proxy_pass http://127.0.0.1:10003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
        }

        # ── gRPC locations ────────────────────────────────────
        location /1f3b70d23d99691f {
            grpc_pass grpc://127.0.0.1:10005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /00fc3006154f9806 {
            grpc_pass grpc://127.0.0.1:10006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /67dc1f7a4d9e4d53 {
            proxy_pass http://127.0.0.1:10011;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
        }

        location /d75be1bc520c1c8d {
            grpc_pass grpc://127.0.0.1:10012;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /e816653ca29f4224 {
            grpc_pass grpc://127.0.0.1:10013;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── HTTPUpgrade locations ─────────────────────────────
        location /a2eae166348f0351 {
            proxy_pass http://127.0.0.1:10014;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
        }

        location /3f0c65d2b9ef519d {
            proxy_pass http://127.0.0.1:10015;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_connect_timeout 86400;
        }

        location /8afe616dc9df15a5 {
            proxy_pass http://127.0.0.1:10016;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
